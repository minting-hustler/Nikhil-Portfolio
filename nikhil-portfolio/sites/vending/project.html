<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nikhil Kumar — Vending</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;700&family=Monoton&family=Yellowtail&family=Tilt+Neon&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&display=swap">
<link rel="stylesheet" href="pages.css">
<style>
  .hero { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: clamp(28px, 5vw, 72px); align-items: center; padding: clamp(20px, 5vh, 50px) 0 clamp(50px, 9vh, 96px); }
  .slot { position: relative; text-align: center; }
  .slot .code { font: 400 clamp(130px, 19vw, 260px)/.9 var(--neon); letter-spacing: .02em; display: block; }
  .slot .cap { display: block; margin-top: 14px; font: 400 clamp(26px, 3vw, 38px)/1 var(--script); }
  .slot .backing { position: absolute; inset: -6% -4%; border-radius: 26px; border: 1px solid rgba(255,255,255,.06); background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); z-index: -1; }
  .slot .backing::before, .slot .backing::after { content: ''; position: absolute; top: -24px; width: 2px; height: 24px; background: linear-gradient(#5a5262, #2a2530); }
  .slot .backing::before { left: 22%; } .slot .backing::after { right: 22%; }
  .cat { margin-bottom: 22px; }
  .stat { display: flex; align-items: baseline; gap: 16px; margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); }
  .stat b { font: 400 clamp(46px, 5vw, 64px)/1 var(--tube); }
  .stat span { font: italic 400 17px/1.35 var(--didone); color: var(--soft); max-width: 22ch; }

  .inside { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 40px; }
  .inside li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; font-size: 18px; line-height: 1.55; }
  .inside li i { font: 400 28px/1 var(--tube); font-style: normal; }

  /* the dispense sequence: a tube that lights up stage by stage as you scroll */
  .seq { position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .seq::before { content: ''; position: absolute; left: 22px; right: 22px; top: 22px; height: 3px; border-radius: 2px; background: #2a2530; }
  .seq .wire { position: absolute; left: 22px; top: 22px; height: 3px; border-radius: 2px; width: 0; background: color-mix(in srgb, var(--c) 30%, #fff); box-shadow: 0 0 6px var(--c), 0 0 16px var(--c); }
  .seq li { position: relative; }
  .seq .n { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #3a3442; background: var(--wall); display: grid; place-items: center; font: 400 19px/1 var(--tube); color: #5a5262; transition: all .4s; }
  .seq li.lit .n { border-color: color-mix(in srgb, var(--c) 60%, #fff); color: #fff; text-shadow: var(--glow); box-shadow: 0 0 10px var(--c), inset 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }
  .seq h3 { margin: 18px 0 8px; font: 400 22px/1.1 var(--tube); letter-spacing: .06em; }
  .seq p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--soft); }

  .result { margin: 0; font: italic 400 clamp(28px, 3.6vw, 46px)/1.22 var(--didone); max-width: 26ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
  .next { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 40px 0 50px; border-top: 1px solid var(--line); }
  .next a { text-decoration: none; padding: 22px 24px; border: 1px solid var(--line); border-radius: 16px; transition: border-color .3s, background .3s; }
  .next a:hover { border-color: #3f3848; background: rgba(255,255,255,.02); }
  .next a:last-child { text-align: right; }
  .next small { display: block; font: 400 13px/1 var(--tube); letter-spacing: .2em; color: var(--mute); margin-bottom: 10px; }
  .next strong { font: 400 clamp(20px, 2.2vw, 28px)/1.15 var(--didone); }
  .next em { font: 400 24px/1 var(--neon); vertical-align: -2px; font-style: normal; margin-right: 10px; }
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .slot .code { font-size: clamp(110px, 38vw, 200px); }
    .inside { grid-template-columns: 1fr; }
    .seq { grid-template-columns: 1fr; gap: 26px; padding-left: 64px; }
    .seq::before, .seq .wire { left: 22px; top: 22px; bottom: 22px; right: auto; width: 3px; height: auto; }
    .seq .wire { height: 0; bottom: auto; }
    .seq .n { position: absolute; left: -64px; top: 0; }
    .seq h3 { margin-top: 10px; }
    .next { grid-template-columns: 1fr; }
    .next a:last-child { text-align: left; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top"><a href="index.html"><svg class="arrow" viewBox="0 0 22 14" style="transform:scaleX(-1)"><path d="M1 7h19M14 1l6 6-6 6"/></svg>Back to the machine</a><span class="code" id="crumb"></span></header>

  <div class="hero">
    <div class="slot rv"><div class="backing"></div><span class="code tube buzz" id="code"></span><span class="cap tube on" id="cap" style="animation-delay:.5s"></span></div>
    <div>
      <div class="eyebrow cat rv" id="cat"></div>
      <h1 class="title rv" id="title"></h1>
      <p class="dek rv" id="dek"></p>
      <div class="stat rv"><b class="tube on" id="num" style="animation-delay:.9s"></b><span id="lab"></span></div>
    </div>
  </div>

  <div class="label rv" id="label"></div>

  <section class="sec"><h2 class="rv"><small>01</small>The problem</h2><p class="big rv" id="problem"></p></section>
  <section class="sec"><h2 class="rv"><small>02</small>What's inside</h2><ul class="inside" id="inside"></ul></section>
  <section class="sec"><h2 class="rv"><small>03</small>How it works</h2><ol class="seq" id="seq"><span class="wire" id="wire"></span></ol></section>
  <section class="sec"><h2 class="rv"><small>04</small>Result</h2><div><p class="result rv" id="result"></p><div class="actions rv" id="actions"></div></div></section>

  <nav class="next" id="next" aria-label="More cans"></nav>
  <footer class="foot"><span>NIKHIL MFG. CO. · MODEL 2026</span><a href="about.html">ABOUT NIKHIL</a><a href="mailto:nikhil385713@gmail.com">nikhil385713@gmail.com</a></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../shared/content.js"></script>
<script>
(function () {
  var P = window.PORTFOLIO, list = P.projects;
  var p = P.byId(new URLSearchParams(location.search).get('id')), i = list.indexOf(p);
  var $ = function (s) { return document.getElementById(s); };
  var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var arrow = '<svg class="arrow" viewBox="0 0 22 14"><path d="M1 7h19M14 1l6 6-6 6"/></svg>';
  document.title = p.title + ' — Nikhil Kumar';
  document.documentElement.style.setProperty('--c', p.color);
  $('crumb').textContent = 'SLOT ' + p.code + ' · ' + (i + 1) + ' OF ' + list.length;
  $('code').textContent = p.code;
  $('cap').textContent = p.cat === 'WORK' ? 'Made at ' + p.org : p.cat === 'RESEARCH' ? 'Research' : 'Side project';
  $('cat').textContent = p.cat + ' · ' + p.period;
  // set the last word of the title in italics, the way a fashion masthead would
  var words = p.title.split(' '), last = words.pop();
  $('title').innerHTML = esc(words.join(' ')) + ' <em>' + esc(last) + '</em>';
  $('dek').textContent = p.dek;
  $('num').textContent = p.stat[0];
  $('lab').textContent = p.stat[1];
  $('label').innerHTML = '<h3>WHAT’S INSIDE</h3><hr>' + [['MY ROLE', p.role], ['WHERE', p.org], ['WHEN', p.period], ['MADE WITH', p.stack.join(' · ')], ['STATUS', p.status]]
    .map(function (r) { return '<div class="row"><b>' + r[0] + '</b><span>' + esc(r[1]) + '</span></div>'; }).join('') + '<small>' + esc(p.outcome) + '</small>';
  $('problem').textContent = p.problem;
  $('inside').innerHTML = p.built.map(function (b, k) { return '<li class="rv"><i class="tube on" style="animation-delay:' + (k * 0.15) + 's">0' + (k + 1) + '</i><span>' + esc(b) + '</span></li>'; }).join('');
  $('seq').insertAdjacentHTML('beforeend', p.how.map(function (h, k) { return '<li class="rv"><div class="n">' + (k + 1) + '</div><h3>' + esc(h[0]) + '</h3><p>' + esc(h[1]) + '</p></li>'; }).join(''));
  $('result').textContent = p.outcome;
  var L = p.links || {};
  $('actions').innerHTML = (L.live ? '<a class="nsign hot" href="' + L.live + '" data-todo="live-url">Open live project ' + arrow + '</a>' : '') + (L.source ? '<a class="nsign" href="' + L.source + '" data-todo="source-url">View source ' + arrow + '</a>' : '') + '<a class="nsign" href="mailto:nikhil385713@gmail.com?subject=' + encodeURIComponent('About ' + p.title) + '">Ask me about it ' + arrow + '</a>';
  var prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  $('next').innerHTML = '<a href="project.html?id=' + prev.code + '" style="--c:' + prev.color + '"><small>&larr; PREVIOUS SLOT</small><strong><em class="tube on">' + prev.code + '</em>' + esc(prev.title) + '</strong></a><a href="project.html?id=' + next.code + '" style="--c:' + next.color + '"><small>NEXT SLOT &rarr;</small><strong><em class="tube on">' + next.code + '</em>' + esc(next.title) + '</strong></a>';

  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var steps = document.querySelectorAll('.seq li');
  if (RM || !window.gsap) { document.documentElement.classList.add('rm'); steps.forEach(function (s) { s.classList.add('lit'); }); return; }
  var io = new IntersectionObserver(function (es) {
    var b = es.filter(function (e) { return e.isIntersecting; }).map(function (e) { io.unobserve(e.target); return e.target; });
    if (b.length) gsap.to(b, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', stagger: 0.08 });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.rv').forEach(function (el) { io.observe(el); });
  // light the sequence tube stage by stage once it is on screen
  var seq = $('seq'), wire = $('wire');
  var io2 = new IntersectionObserver(function (es) {
    if (!es[0].isIntersecting) return; io2.disconnect();
    var vertical = innerWidth <= 860, tl = gsap.timeline({ delay: 0.3 });
    steps.forEach(function (s, k) {
      tl.call(function () { s.classList.add('lit'); });
      if (k < steps.length - 1) {
        var a = steps[k].querySelector('.n').getBoundingClientRect(), b = steps[k + 1].querySelector('.n').getBoundingClientRect(), o = seq.getBoundingClientRect();
        tl.to(wire, vertical ? { height: (b.top - o.top) - 22 + 23, duration: 0.45, ease: 'none' } : { width: (b.left - o.left) - 22 + 23, duration: 0.45, ease: 'none' });
      }
    });
  }, { threshold: 0.4 });
  io2.observe(seq);
})();
</script>
</body>
</html>

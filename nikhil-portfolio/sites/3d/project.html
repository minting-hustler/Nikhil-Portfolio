<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project — Nikhil Kumar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function () {
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('portfolio-theme') === 'dark' ? 'dark' : 'light'); }
    catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<style>
  :root { --bg: #FCFCFA; --bg-raised: #F2F1EC; --text: #0A0A0A; --text-soft: rgba(10,10,10,0.58); --line: rgba(10,10,10,0.12); --accent: #E4002B; --p: #E4002B; font-family: 'Inter', -apple-system, sans-serif; }
  :root[data-theme="dark"] { --bg: #0A0A0A; --bg-raised: #151513; --text: #F5F4F0; --text-soft: rgba(245,244,240,0.6); --line: rgba(245,244,240,0.14); --accent: #FF3B3B; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); overflow-x: clip; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 44px); }
  .disp { font-family: 'Bricolage Grotesque', sans-serif; }

  .top { display: flex; justify-content: space-between; align-items: center; padding: clamp(20px, 3vw, 32px) 0; }
  .back { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-size: 14px; color: var(--text-soft); }
  .back:hover { color: var(--text); }
  .back svg { transition: transform .3s ease; } .back:hover svg { transform: translateX(-4px); }
  .crumb { font-size: 12px; color: var(--text-soft); font-variant-numeric: tabular-nums; }

  .hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: center; padding: clamp(24px, 6vh, 64px) 0 clamp(40px, 8vh, 90px); }
  .kicker { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--text-soft); margin-bottom: 22px; flex-wrap: wrap; }
  .kicker .cat { color: var(--bg); background: var(--text); padding: 4px 10px; border-radius: 999px; font-size: 11px; letter-spacing: .12em; font-weight: 600; }
  h1 { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(2.6rem, 6.4vw, 5.6rem); line-height: .92; letter-spacing: -0.03em; }
  .dek { margin: 26px 0 0; font-size: clamp(1.1rem, 1.8vw, 1.35rem); line-height: 1.5; color: var(--text-soft); max-width: 46ch; }

  /* the 3D stat card: tilts with the pointer */
  .card-zone { perspective: 1100px; display: flex; justify-content: center; }
  .card { position: relative; width: min(100%, 400px); aspect-ratio: 4 / 5; border-radius: 22px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; color: #0A0A0A;
    background: linear-gradient(150deg, color-mix(in srgb, var(--p) 92%, #fff) 0%, var(--p) 55%, color-mix(in srgb, var(--p) 70%, #000) 100%);
    transform-style: preserve-3d; box-shadow: 0 50px 80px -30px color-mix(in srgb, var(--p) 55%, transparent), 0 20px 40px -20px rgba(0,0,0,.4); will-change: transform; }
  .card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(circle at var(--gx, 30%) var(--gy, 20%), rgba(255,255,255,.55), transparent 45%); mix-blend-mode: soft-light; pointer-events: none; }
  .card .code { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .1em; transform: translateZ(30px); display: flex; justify-content: space-between; }
  .card .num { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(4.4rem, 10vw, 7.4rem); line-height: .85; letter-spacing: -0.04em; transform: translateZ(70px); word-break: break-word; }
  .card .lab { font-size: 15px; line-height: 1.35; font-weight: 500; max-width: 24ch; transform: translateZ(40px); }
  .card .grid { position: absolute; inset: 0; border-radius: inherit; background-image: linear-gradient(rgba(0,0,0,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.08) 1px, transparent 1px); background-size: 28px 28px; -webkit-mask: linear-gradient(160deg, #000, transparent 70%); mask: linear-gradient(160deg, #000, transparent 70%); }

  .meta { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--text); border-bottom: 1px solid var(--line); }
  .meta div { padding: 18px 18px 18px 0; }
  .meta div + div { padding-left: 18px; border-left: 1px solid var(--line); }
  .meta dt { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 6px; }
  .meta dd { margin: 0; font-size: 15px; line-height: 1.4; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 22px 0 0; }
  .tag { font-size: 12px; border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; background: var(--bg-raised); }

  section.block { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; padding: clamp(48px, 8vh, 88px) 0; border-bottom: 1px solid var(--line); }
  .block h2 { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; display: flex; gap: 10px; align-items: baseline; }
  .block h2 small { font-size: 12px; color: var(--accent); font-weight: 600; }
  .problem { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: clamp(1.4rem, 2.6vw, 2.1rem); line-height: 1.3; letter-spacing: -0.01em; max-width: 34ch; }
  .built { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line); }
  .built li:nth-child(even) { border-left: 1px solid var(--line); }
  .built li { border-bottom: 1px solid var(--line); padding: 26px 24px; font-size: 16px; line-height: 1.55; position: relative; }
  .built li b { display: block; font-family: 'Bricolage Grotesque', sans-serif; font-size: 2.2rem; line-height: 1; color: var(--p); margin-bottom: 14px; -webkit-text-stroke: 1px color-mix(in srgb, var(--p) 60%, #000); }

  .flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; counter-reset: s; }
  .flow li { position: relative; padding: 22px 18px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--bg-raised); transform-style: preserve-3d; transition: transform .4s cubic-bezier(.2,.8,.2,1), border-color .3s; }
  .flow li:hover { transform: translateY(-6px) rotateX(8deg); border-color: var(--p); }
  .flow li::before { counter-increment: s; content: '0' counter(s); display: block; font-size: 12px; color: var(--text-soft); margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .flow li:not(:last-child)::after { content: ''; position: absolute; top: 34px; right: -15px; width: 16px; height: 2px; background: var(--p); }
  .flow h3 { margin: 0 0 8px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 1.25rem; }
  .flow p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-soft); }

  .outcome { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(1.6rem, 3.4vw, 2.8rem); line-height: 1.15; letter-spacing: -0.02em; max-width: 26ch; }
  .outcome::before { content: '\2192\00a0'; color: var(--p); }
  .links { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 999px; text-decoration: none; font-size: 14px; font-weight: 600; border: 1px solid var(--text); }
  .btn.solid { background: var(--text); color: var(--bg); }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); margin: clamp(48px, 8vh, 88px) 0 0; border: 1px solid var(--line); }
  .pager a { background: var(--bg); padding: 28px; text-decoration: none; display: flex; flex-direction: column; gap: 8px; transition: background .3s; }
  .pager a:hover { background: var(--bg-raised); }
  .pager a.next { text-align: right; align-items: flex-end; }
  .pager small { font-size: 12px; color: var(--text-soft); }
  .pager span { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(1.1rem, 2.2vw, 1.6rem); }
  footer { padding: 40px 0 50px; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-soft); flex-wrap: wrap; gap: 10px; }

  .rv { opacity: 0; transform: translateY(24px); }
  .no-js .rv, .rm .rv { opacity: 1; transform: none; }

  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .card { width: min(100%, 340px); aspect-ratio: 1 / 1; }
    .meta { grid-template-columns: 1fr 1fr; }
    .meta div:nth-child(3) { padding-left: 0; border-left: 0; }
    .meta div:nth-child(n+3) { border-top: 1px solid var(--line); }
    section.block { grid-template-columns: 1fr; gap: 18px; }
    .built { grid-template-columns: 1fr; } .built li:nth-child(even) { border-left: 0; }
    .flow { grid-template-columns: 1fr 1fr; }
    .flow li:nth-child(2)::after { display: none; }
  }
  @media (max-width: 480px) { .flow { grid-template-columns: 1fr; } .flow li::after { display: none; } .pager { grid-template-columns: 1fr; } .pager a.next { text-align: left; align-items: flex-start; } }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; } .flow li:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="index.html#projects"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>All projects</a>
    <span class="crumb" id="crumb"></span>
  </header>

  <div class="hero">
    <div>
      <div class="kicker rv"><span class="cat" id="cat"></span><span id="orgline"></span></div>
      <h1 class="rv" id="title"></h1>
      <p class="dek rv" id="dek"></p>
    </div>
    <div class="card-zone rv">
      <div class="card" id="card">
        <div class="grid"></div>
        <div class="code"><span id="code"></span><span>N.K.</span></div>
        <div><div class="num" id="num"></div><div class="lab" id="lab"></div></div>
      </div>
    </div>
  </div>

  <dl class="meta rv" id="meta"></dl>
  <div class="tags rv" id="stack"></div>

  <section class="block"><h2 class="rv"><small>01</small>The problem</h2><p class="problem rv" id="problem"></p></section>
  <section class="block"><h2 class="rv"><small>02</small>What I built</h2><ul class="built" id="built"></ul></section>
  <section class="block"><h2 class="rv"><small>03</small>How it works</h2><ol class="flow" id="flow"></ol></section>
  <section class="block"><h2 class="rv"><small>04</small>Result</h2><div><p class="outcome rv" id="outcome"></p><div class="links rv" id="links"></div></div></section>

  <nav class="pager" aria-label="More projects"><a class="prev" id="prev"></a><a class="next" id="next"></a></nav>
  <footer><span>Nikhil Kumar · AI &amp; Backend Engineer</span><a href="mailto:nikhil385713@gmail.com">nikhil385713@gmail.com</a></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../shared/content.js"></script>
<script>
(function () {
  var P = window.PORTFOLIO, list = P.projects;
  var id = new URLSearchParams(location.search).get('id');
  var p = P.byId(id), i = list.indexOf(p);
  var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var $ = function (s) { return document.getElementById(s); };
  document.title = p.title + ' — Nikhil Kumar';
  document.documentElement.style.setProperty('--p', p.color);
  $('crumb').textContent = p.code + ' / ' + String(list.length).padStart(2, '0');
  $('cat').textContent = p.cat;
  $('orgline').textContent = p.org + ' · ' + p.period;
  $('title').textContent = p.title;
  $('dek').textContent = p.dek;
  $('code').textContent = 'SLOT ' + p.code;
  $('num').textContent = p.stat[0];
  $('lab').textContent = p.stat[1];
  $('meta').innerHTML = [['Role', p.role], ['Where', p.org], ['When', p.period], ['Status', p.status]].map(function (m) { return '<div><dt>' + m[0] + '</dt><dd>' + esc(m[1]) + '</dd></div>'; }).join('');
  $('stack').innerHTML = p.stack.map(function (s) { return '<span class="tag">' + esc(s) + '</span>'; }).join('');
  $('problem').textContent = p.problem;
  $('built').innerHTML = p.built.map(function (b, k) { return '<li class="rv"><b>' + String(k + 1).padStart(2, '0') + '</b>' + esc(b) + '</li>'; }).join('');
  $('flow').innerHTML = p.how.map(function (h) { return '<li class="rv"><h3>' + esc(h[0]) + '</h3><p>' + esc(h[1]) + '</p></li>'; }).join('');
  $('outcome').textContent = p.outcome;
  var L = p.links || {};
  $('links').innerHTML = (L.live ? '<a class="btn solid" href="' + L.live + '" data-todo="live-url">Open live project</a>' : '') + (L.source ? '<a class="btn" href="' + L.source + '" data-todo="source-url">View source</a>' : '') + '<a class="btn" href="mailto:nikhil385713@gmail.com?subject=' + encodeURIComponent('About ' + p.title) + '">Ask me about it</a>';
  var prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  $('prev').href = 'project.html?id=' + prev.id; $('prev').innerHTML = '<small>&larr; Previous</small><span>' + esc(prev.title) + '</span>';
  $('next').href = 'project.html?id=' + next.id; $('next').innerHTML = '<small>Next &rarr;</small><span>' + esc(next.title) + '</span>';

  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !window.gsap) { document.documentElement.classList.add('rm'); return; }

  // reveal on scroll
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      gsap.to(e.target, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', delay: (e.target.dataset.d || 0) * 0.07 });
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.rv').forEach(function (el) {
    var sib = el.parentElement.querySelectorAll(':scope > .rv'); el.dataset.d = Array.prototype.indexOf.call(sib, el);
    io.observe(el);
  });
  // the big number counts up when it has digits
  var m = p.stat[0].match(/^([<>]?)(\d+)(.*)$/);
  if (m) { var o = { v: 0 }; gsap.to(o, { v: +m[2], duration: 1.6, ease: 'power2.out', delay: 0.4, onUpdate: function () { $('num').textContent = m[1] + Math.round(o.v) + m[3]; } }); }

  // 3D tilt
  var card = $('card'), zone = card.parentElement;
  gsap.set(card, { rotateY: -14, rotateX: 6 });
  var rx = gsap.quickTo(card, 'rotateX', { duration: 0.6, ease: 'power3.out' });
  var ry = gsap.quickTo(card, 'rotateY', { duration: 0.6, ease: 'power3.out' });
  window.addEventListener('pointermove', function (e) {
    var r = zone.getBoundingClientRect();
    var x = (e.clientX - (r.left + r.width / 2)) / innerWidth, y = (e.clientY - (r.top + r.height / 2)) / innerHeight;
    ry(x * 34); rx(-y * 24);
    card.style.setProperty('--gx', (50 + x * 80) + '%'); card.style.setProperty('--gy', (40 + y * 80) + '%');
  });
  gsap.to(card, { y: -10, duration: 2.4, ease: 'sine.inOut', yoyo: true, repeat: -1 });
})();
</script>
</body>
</html>

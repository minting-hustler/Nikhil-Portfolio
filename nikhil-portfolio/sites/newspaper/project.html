<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Nikhil Gazette</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="page.css">
<style>
  .spread { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 0 34px; margin-top: 26px; }
  .main .cols { columns: 3; }
  .rail { border-left: 1px solid var(--rule); padding-left: 34px; display: flex; flex-direction: column; gap: 22px; }
  .stat { border: 1px solid var(--rule); padding: 18px; text-align: center; background: var(--ink); color: var(--paper); }
  .stat .mono { font-size: 10.5px; color: #e3b0a8; }
  .stat .n { font-family: 'Old Standard TT', Georgia, serif; font-weight: 700; font-size: 86px; line-height: 1; margin: 10px 0 8px; }
  .stat p { margin: 0; font-style: italic; font-size: 17px; line-height: 1.35; }
  .also { list-style: none; margin: 0; padding: 0; }
  .also li { border-bottom: 1px dotted #8a8274; }
  .also a { display: block; padding: 10px 0; }
  .also small { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .also strong { font-family: 'Old Standard TT', Georgia, serif; font-size: 18px; line-height: 1.15; }
  .outcome { break-inside: avoid; margin: 6px 0 14px; padding: 14px 0; border-top: 3px solid var(--rule); border-bottom: 1px solid var(--rule); font-family: 'Old Standard TT', Georgia, serif; font-size: 21px; line-height: 1.3; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .links a { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 10px 12px; border: 1px solid var(--rule); }
  .links a.solid { background: var(--ink); color: var(--paper); }
  .stackline { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .06em; line-height: 1.6; }
  @media (max-width: 1100px) { .main .cols { columns: 2; } }
  @media (max-width: 900px) { .spread { grid-template-columns: 1fr; } .rail { border-left: 0; padding-left: 0; margin-top: 26px; border-top: 4px double var(--rule); padding-top: 22px; } }
</style>
</head>
<body>
<div class="sheet" data-hl-root>
  <div class="strip"><a href="index.html">&larr; Front page</a><span id="edition">Page A3</span><span id="pageno"></span></div>
  <div class="flag"><div class="l">AI &amp; Backend<br><b>Engineering</b></div><div class="name">The Nikhil Gazette</div><div class="r">Now serving at<br><b>Chat360 · Since 2025</b></div></div>
  <div class="section-tag"><span id="desk"></span><span id="deskr"></span></div>

  <div class="kicker ink" id="kicker"></div>
  <h1 class="head ink" id="head"></h1>
  <p class="deck ink" id="deck"></p>
  <div class="byline ink"><span>By <b>Nikhil Kumar</b></span><span id="dateline"></span><span id="status"></span></div>

  <div class="spread">
    <article class="main"><div class="cols ink" id="body"></div></article>
    <aside class="rail">
      <div class="stat ink"><div class="mono">By the numbers</div><div class="n" id="num"></div><p id="lab"></p></div>
      <div class="box ink"><h4>The facts</h4><dl id="facts"></dl></div>
      <div class="box ink"><h4>Also in this edition</h4><ul class="also" id="also"></ul></div>
    </aside>
  </div>

  <nav class="continued" aria-label="More stories"><a id="prev"></a><a id="next"></a></nav>
  <div class="colophon"><span>The Nikhil Gazette · <a href="about.html">About the editor</a></span><span>Tip: highlight any line, then click it</span><span>© 2026 Nikhil Kumar</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../shared/content.js"></script>
<script>
(function () {
  var P = window.PORTFOLIO, list = P.projects;
  var p = P.byId(new URLSearchParams(location.search).get('id')), i = list.indexOf(p);
  var $ = function (s) { return document.getElementById(s); };
  var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  // newspaper headlines for each story (the front page uses the same ones)
  var HEAD = {
    'memory': 'Engineer Gives Chatbots A Memory That Follows You Across Five Channels',
    'agents': 'Orchestration Under Five Seconds',
    'pdf-vision': 'Pictures Now Answer Questions Too',
    'auto-bot': 'A Bot That Listens To Your Engine',
    'api-logs': 'Every API Call, On The Record',
    'ask-ai': '“Ask-AI” Answers In One Sentence',
    'rag-tuning': 'Better Answers From The Same Documents, For Less',
    'redis-cache': 'Fewer LLM Calls, Faster Replies',
    'ingestion': 'Intern Teaches The Bots To Read A Website',
    'opd-claims': 'An AI That Reads Your Medical Claim Before A Human Does',
    'rl-control': 'Teaching A Controller To Learn From An Expert',
    'f1-club': 'Formula 1 Club Goes Live, Lights Out',
  };
  var headline = HEAD[p.id] || p.title;
  document.body.dataset.story = p.id;
  document.title = headline + ' — The Nikhil Gazette';
  var desk = p.cat === 'WORK' ? 'The Chat360 Newsroom' : p.cat === 'RESEARCH' ? 'Science & Research' : 'Features';
  $('desk').textContent = desk; $('deskr').textContent = p.title;
  $('pageno').textContent = 'Story ' + (i + 1) + ' of ' + list.length;
  $('kicker').textContent = p.org + ' · ' + p.stack.slice(0, 3).join(' · ');
  $('head').textContent = headline;
  $('deck').textContent = p.dek;
  $('dateline').textContent = 'Filed ' + p.period;
  $('status').textContent = p.status;
  $('num').textContent = p.stat[0];
  $('lab').textContent = p.stat[1];

  var lower = function (s) { return s.charAt(0).toLowerCase() + s.slice(1); };
  var html = '<p class="drop">' + esc(p.problem) + '</p>';
  html += '<h3 class="subhead">What was built</h3>';
  html += '<p>' + esc(p.role.split(' (')[0]) + ' Nikhil Kumar ' + (p.status === 'In production' ? 'built and shipped' : 'built') + ' the following:</p>';
  html += p.built.map(function (b) { return '<p class="dash">— ' + esc(b) + '</p>'; }).join('');
  html += '<h3 class="subhead">How it works</h3><ol class="wire">' + p.how.map(function (h) { return '<li><b>' + esc(h[0]) + '.</b> ' + esc(h[1]) + '</li>'; }).join('') + '</ol>';
  html += '<h3 class="subhead">The result</h3><p class="outcome">' + esc(p.outcome) + '</p>';
  var L = p.links || {};
  html += '<div class="links">' + (L.live ? '<a class="solid" href="' + L.live + '" data-todo="live-url">Open live project</a>' : '') + (L.source ? '<a href="' + L.source + '" data-todo="source-url">Source code</a>' : '') + '<a href="mailto:nikhil385713@gmail.com?subject=' + encodeURIComponent('About ' + p.title) + '">Write to the editor</a></div>';
  $('body').innerHTML = html;

  $('facts').innerHTML = [['Role', p.role], ['Where', p.org], ['When', p.period], ['Status', p.status], ['Made with', '<span class="stackline">' + p.stack.map(esc).join(' · ') + '</span>']]
    .map(function (f, k) { return '<div><dt>' + f[0] + '</dt><dd>' + (k === 4 ? f[1] : esc(f[1])) + '</dd></div>'; }).join('');
  var others = [1, 2, 3, 4].map(function (d) { return list[(i + d) % list.length]; });
  $('also').innerHTML = others.map(function (o) { return '<li><a href="project.html?id=' + o.id + '"><small>' + esc(o.org) + '</small><strong>' + esc(HEAD[o.id] || o.title) + '</strong></a></li>'; }).join('');
  var prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
  $('prev').href = 'project.html?id=' + prev.id; $('prev').innerHTML = '<small>&larr; Previous story</small><strong>' + esc(HEAD[prev.id] || prev.title) + '</strong>';
  $('next').href = 'project.html?id=' + next.id; $('next').innerHTML = '<small>Continued on next page &rarr;</small><strong>' + esc(HEAD[next.id] || next.title) + '</strong>';
})();
</script>
<script src="inside.js"></script>
<script src="highlighter.js"></script>
</body>
</html>

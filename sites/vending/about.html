<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>About Nikhil Kumar — Vending</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;700&family=Monoton&family=Yellowtail&family=Tilt+Neon&family=Share+Tech+Mono&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&display=swap">
<link rel="stylesheet" href="pages.css">
<style>
  .hero { padding: clamp(20px, 5vh, 56px) 0 clamp(40px, 7vh, 80px); text-align: center; }
  .hello { --c: #ff2b8a; display: block; font: 400 clamp(36px, 5vw, 64px)/1 var(--script); transform: rotate(-5deg); margin-bottom: -6px; }
  .big-name { --c: #ff2a10; display: block; font: 400 clamp(64px, 13vw, 180px)/1 var(--neon); letter-spacing: .02em; white-space: nowrap; }
  .surname { display: block; margin-top: 18px; font: 500 clamp(13px, 1.4vw, 17px)/1 var(--didone); letter-spacing: .9em; padding-left: .9em; color: var(--cream); }
  .hero .title { margin: 46px auto 0; max-width: 18ch; font-size: clamp(34px, 4.8vw, 66px); }
  .spread { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: clamp(30px, 5vw, 72px); padding: clamp(40px, 7vh, 80px) 0; border-top: 1px solid var(--line); }
  .read { columns: 2; column-gap: 40px; }
  .read p { margin: 0 0 18px; font-size: 18.5px; line-height: 1.66; color: #e9e2d2; break-inside: avoid-column; }
  .read p:first-child::first-letter { float: left; font: 400 92px/.76 var(--neon); color: #fff2ee; text-shadow: 0 0 1px #fff, 0 0 6px #ff3a1a, 0 0 16px #ff2a10, 0 0 30px #c40008; margin: 8px 12px 0 0; }
  /* facts printed on thermal paper, like the machine's receipts */
  .receipt { position: relative; align-self: start; padding: 22px 22px 18px; color: #2a2420; font: 400 14px/1.5 'Share Tech Mono', monospace; transform: rotate(1.4deg);
    background: linear-gradient(90deg, #e8e0cc, #fbf7ec 12%, #f8f3e6 85%, #ddd4bf); box-shadow: 0 24px 50px rgba(0,0,0,.55);
    -webkit-mask: linear-gradient(#000, #000) 0 10px / 100% calc(100% - 20px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 0 0 / 14px 10px repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) 0 100% / 14px 10px repeat-x;
            mask: linear-gradient(#000, #000) 0 10px / 100% calc(100% - 20px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 0 0 / 14px 10px repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) 0 100% / 14px 10px repeat-x; }
  .receipt .c { text-align: center; }
  .receipt hr { border: 0; border-top: 1px dashed #2a2420; margin: 10px 0; }
  .receipt .ln { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .receipt .ln b { font-weight: 400; text-transform: uppercase; flex: none; }
  .receipt .ln span { text-align: right; }
  .receipt .bar { height: 34px; margin-top: 12px; background: repeating-linear-gradient(90deg, #2a2420 0 2px, transparent 2px 4px, #2a2420 4px 5px, transparent 5px 8px, #2a2420 8px 11px, transparent 11px 12px); }

  /* the OPEN sign */
  .open { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(26px, 5vw, 64px); align-items: center; padding: clamp(46px, 8vh, 90px) 0; border-top: 1px solid var(--line); }
  .board { --c: #2f7bff; position: relative; padding: 22px 34px 18px; border-radius: 28px; border: 4px solid color-mix(in srgb, var(--c) 30%, #fff); box-shadow: 0 0 8px var(--c), 0 0 22px var(--c), inset 0 0 12px color-mix(in srgb, var(--c) 70%, transparent), 0 0 60px color-mix(in srgb, var(--c) 40%, transparent); text-align: center; background: rgba(0,0,0,.25); }
  .board .w { --c: #ff2a10; display: block; font: 400 clamp(52px, 8vw, 96px)/1 var(--neon); letter-spacing: .04em; }
  .board .s { --c: #ffb52e; display: block; margin-top: 4px; font: 400 clamp(26px, 3vw, 34px)/1 var(--script); }
  .board::before, .board::after { content: ''; position: absolute; top: -40px; width: 2px; height: 40px; background: linear-gradient(#5a5262, #2a2530); }
  .board::before { left: 18%; } .board::after { right: 18%; }
  .open p { margin: 0 0 22px; font: 400 clamp(24px, 2.8vw, 34px)/1.3 var(--didone); max-width: 24ch; }
  .open p em { color: var(--soft); }
  .open .acts { display: flex; flex-wrap: wrap; gap: 12px; }
  @media (max-width: 900px) {
    .spread { grid-template-columns: 1fr; }
    .read { columns: 1; }
    .receipt { max-width: 360px; justify-self: center; }
    .open { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .open p { margin-left: auto; margin-right: auto; }
    .open .acts { justify-content: center; }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../shared/content.js"></script>
<script>
(function () {
  var A = window.PORTFOLIO.about, $ = function (i) { return document.getElementById(i); };
  var esc = function (t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var h = A.headline.split('. ');
  $('head').innerHTML = esc(h[0]) + '.' + (h[1] ? ' <em>' + esc(h[1]) + '</em>' : '');
  $('body').innerHTML = A.paras.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('');
  $('facts').innerHTML = A.facts.map(function (f) { return '<div class="ln"><b>' + esc(f[0]) + '</b><span>' + esc(f[1]) + '</span></div>'; }).join('');
  $('looking').innerHTML = 'Looking for: <em>' + esc(A.lookingFor) + '</em>';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !window.gsap) { document.documentElement.classList.add('rm'); return; }
  var io = new IntersectionObserver(function (es) {
    var b = es.filter(function (e) { return e.isIntersecting; }).map(function (e) { io.unobserve(e.target); return e.target; });
    if (b.length) gsap.to(b, { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', stagger: 0.1 });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('.rv').forEach(function (el) { io.observe(el); });
})();
</script>
</body>
</html>
